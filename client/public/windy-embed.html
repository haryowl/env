<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windy weather</title>
    <style>
      html, body, #windy {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
      }
      /* Weather is a backdrop; Leaflet in the parent owns pins and clicks */
      #windy .leaflet-control-container,
      #windy #bottom,
      #windy .progress-bar,
      #windy #mobile-ovr-select {
        display: none !important;
      }
    </style>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
  </head>
  <body>
    <div id="windy"></div>
    <script>
      (function () {
        var map = null;
        var starting = false;
        var pending = null;
        var qs = new URLSearchParams(window.location.search || '');

        function applyView(lat, lng, zoom) {
          lat = Number(lat);
          lng = Number(lng);
          zoom = Number(zoom);
          if (!isFinite(lat) || !isFinite(lng)) return;
          if (!map) {
            pending = { lat: lat, lng: lng, zoom: zoom };
            return;
          }
          try {
            map.setView([lat, lng], isFinite(zoom) ? zoom : map.getZoom() || 5, { animate: false });
          } catch (e) {}
        }

        function startWindy(key, lat, lon, zoom) {
          if (map || starting) {
            applyView(lat, lon, zoom);
            return;
          }
          if (typeof windyInit !== 'function' || !key) return;
          starting = true;
          windyInit(
            {
              key: key,
              verbose: false,
              lat: isFinite(Number(lat)) ? Number(lat) : -2.5,
              lon: isFinite(Number(lon)) ? Number(lon) : 118,
              zoom: Number(zoom) || 5,
              overlay: 'wind',
            },
            function (windyAPI) {
              map = windyAPI.map;
              try {
                map.invalidateSize(true);
              } catch (e) {}
              if (pending) applyView(pending.lat, pending.lng, pending.zoom);
            }
          );
        }

        window.WindyBridge = {
          setView: applyView,
        };

        window.addEventListener('message', function (event) {
          var data = event.data || {};
          if (!data || data.type !== 'windy-view') return;
          applyView(data.lat, data.lng, data.zoom);
        });

        startWindy(qs.get('key'), qs.get('lat'), qs.get('lon'), qs.get('zoom'));
      })();
    </script>
  </body>
</html>
