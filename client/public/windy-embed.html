<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windy map</title>
    <style>
      html,
      body,
      #windy {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
      }
    </style>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
  </head>
  <body>
    <div id="windy"></div>
    <script>
      (function () {
        var map = null;
        var lastDevices = [];
        var didFit = false;
        var starting = false;
        var pending = { markers: null, pan: null };

        function notify(payload) {
          window.parent.postMessage(payload, '*');
        }

        function applyMarkers(devices) {
          lastDevices = devices || [];
          if (!map) {
            pending.markers = lastDevices;
            return;
          }
          var bounds = [];
          lastDevices.forEach(function (device) {
            var lat = Number(device.lat);
            var lng = Number(device.lng);
            if (!isFinite(lat) || !isFinite(lng)) return;
            bounds.push([lat, lng]);
          });
          if (!didFit && bounds.length) {
            didFit = true;
            try {
              if (bounds.length === 1) {
                map.setView(bounds[0], 9);
              } else {
                map.fitBounds(bounds, { padding: [48, 48], maxZoom: 12 });
              }
            } catch (e) {}
          }
          projectPins();
        }

        function projectPins() {
          if (!map) return;
          var size;
          try {
            size = map.getSize();
          } catch (e) {
            return;
          }
          var pins = [];
          lastDevices.forEach(function (device) {
            var lat = Number(device.lat);
            var lng = Number(device.lng);
            if (!isFinite(lat) || !isFinite(lng)) return;
            var pt = map.latLngToContainerPoint([lat, lng]);
            pins.push({
              id: device.id,
              x: pt.x,
              y: pt.y,
              name: device.name,
              status: device.status,
              hasAlert: device.hasAlert,
              visible: pt.x >= -60 && pt.y >= -60 && pt.x <= size.x + 60 && pt.y <= size.y + 60,
            });
          });
          notify({ type: 'windy-pin-positions', pins: pins });
        }

        function panTo(lat, lng) {
          if (!map) {
            pending.pan = { lat: lat, lng: lng };
            return;
          }
          if (isFinite(lat) && isFinite(lng)) {
            map.setView([lat, lng], Math.max(map.getZoom() || 8, 9));
          }
        }

        function startWindy(opts) {
          if (map || starting) return;
          if (typeof windyInit !== 'function') {
            notify({ type: 'windy-error', message: 'Windy library failed to load' });
            return;
          }
          starting = true;
          if (opts.devices) pending.markers = opts.devices;
          var lat = Number(opts.lat);
          var lon = Number(opts.lon);
          windyInit(
            {
              key: opts.key,
              verbose: false,
              lat: isFinite(lat) ? lat : -2.5,
              lon: isFinite(lon) ? lon : 118,
              zoom: Number(opts.zoom) || 5,
              overlay: 'wind',
            },
            function (windyAPI) {
              map = windyAPI.map;
              ['move', 'zoom', 'moveend', 'zoomend', 'viewreset', 'resize'].forEach(function (evt) {
                map.on(evt, projectPins);
              });
              map.on('click', function () {
                notify({ type: 'windy-map-click' });
              });
              if (windyAPI.broadcast && typeof windyAPI.broadcast.on === 'function') {
                windyAPI.broadcast.on('redrawFinished', projectPins);
              }
              var finish = function () {
                if (pending.markers) applyMarkers(pending.markers);
                if (pending.pan) panTo(pending.pan.lat, pending.pan.lng);
                try {
                  map.invalidateSize(true);
                } catch (e) {}
                projectPins();
                notify({ type: 'windy-ready' });
              };
              setTimeout(finish, 250);
              setTimeout(projectPins, 800);
              setTimeout(projectPins, 1800);
            }
          );
        }

        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var data = event.data || {};
          if (data.type === 'windy-init') {
            if (data.devices) pending.markers = data.devices;
            startWindy(data);
            if (map && data.devices) applyMarkers(data.devices);
          } else if (data.type === 'windy-markers') {
            applyMarkers(data.devices || []);
          } else if (data.type === 'windy-pan') {
            panTo(data.lat, data.lng);
          } else if (data.type === 'windy-project') {
            projectPins();
          }
        });

        notify({ type: 'windy-iframe-ready' });
      })();
    </script>
  </body>
</html>
